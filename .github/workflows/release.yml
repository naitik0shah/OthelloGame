name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: othello-windows-x86_64.exe
          - os: ubuntu-latest
            artifact: othello-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}
          cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage Artifact
        shell: bash
        run: |
          if [ -f "build/Release/othello.exe" ]; then
            cp "build/Release/othello.exe" "${{ matrix.artifact }}"
          elif [ -f "build/othello.exe" ]; then
            cp "build/othello.exe" "${{ matrix.artifact }}"
          elif [ -f "build/Release/othello" ]; then
            cp "build/Release/othello" "${{ matrix.artifact }}"
          elif [ -f "build/othello" ]; then
            cp "build/othello" "${{ matrix.artifact }}"
          elif [ -f "bin/othello.exe" ]; then
            cp "bin/othello.exe" "${{ matrix.artifact }}"
          elif [ -f "bin/othello" ]; then
            cp "bin/othello" "${{ matrix.artifact }}"
          else
            echo "Error: target binary could not be found"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
